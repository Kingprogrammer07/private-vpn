services:
  3x-ui:
    image: ghcr.io/mhsanaei/3x-ui:latest
    container_name: private_vpn
    restart: unless-stopped
    ports:
      - "127.0.0.1:2053:2053"
      - "8443:8443"
    volumes:
      - ./db/:/etc/xray/
      - ./cert/:/root/cert/
    environment:
      - XRAY_VMESS_AEAD_FORCED=false
